name: Build Executables

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊按鈕一鍵打包

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller onnxruntime

      - name: Download PP-OCRv6 Offline Models
        shell: bash
        run: |
          mkdir -p models
          echo "Downloading PP-OCRv6 det small model..."
          curl -L -o models/PP-OCRv6_det_small.onnx "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.10.0/onnx/PP-OCRv6/det/PP-OCRv6_det_small.onnx"
          echo "Downloading PP-OCRv6 rec small model..."
          curl -L -o models/PP-OCRv6_rec_small.onnx "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.10.0/onnx/PP-OCRv6/rec/PP-OCRv6_rec_small.onnx"
          ls -la models/

      - name: Build Windows Executable
        run: |
          pyinstaller --name "MiniOCR-Windows" `
            --windowed `
            --onefile `
            --clean `
            --noconfirm `
            --add-data "models;models" `
            --hidden-import onnxruntime `
            --collect-all rapidocr `
            --collect-all onnxruntime `
            --copy-metadata onnxruntime `
            app.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniOCR-Windows-x64
          path: dist/MiniOCR-Windows.exe
          if-no-files-found: error
